<!DOCTYPE html>
<html>
  <head>
    <base target="_top" />
    <meta charset="utf-8" />
    <style>
      body { font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 2rem; max-width: 720px; color: #1a1a1a; }
      h1 { font-size: 1.4rem; }
      .card { border: 1px solid #ddd; border-radius: 8px; padding: 1rem 1.25rem; margin: 1rem 0; }
      button { font-size: 1rem; padding: 0.5rem 1rem; border-radius: 6px; border: 1px solid #0b57d0; background: #0b57d0; color: #fff; cursor: pointer; }
      button:disabled { opacity: 0.5; cursor: default; }
      .muted { color: #666; font-size: 0.9rem; }
      .result { margin-top: 1rem; font-size: 0.95rem; }
      .result a { color: #0b57d0; }
      .error { color: #b00020; }
      ul { margin: 0.5rem 0; padding-left: 1.2rem; }
    </style>
  </head>
  <body>
    <h1>CCB Admin Sync</h1>
    <p class="muted">Master-account-only tools. More of the sync workflow will live here.</p>

    <div class="card">
      <h2 style="font-size:1.1rem;margin-top:0">Library catalogue</h2>
      <p class="muted">
        Rebuilds the catalogue from the Media sheet into a single Google Doc with
        a stable PDF link the website can point at.
      </p>
      <button id="genBtn" onclick="generate()">Generate catalogue</button>
      <div id="result" class="result"></div>
    </div>

    <script>
      function generate() {
        var btn = document.getElementById('genBtn');
        var out = document.getElementById('result');
        btn.disabled = true;
        out.innerHTML = '<span class="muted">Generating… this can take a moment.</span>';
        google.script.run
          .withSuccessHandler(function (res) {
            btn.disabled = false;
            if (!res || !res.success) {
              out.innerHTML = '<span class="error">Failed: ' + ((res && res.error) || 'unknown error') + '</span>';
              return;
            }
            var lines = (res.sections || [])
              .map(function (s) { return '<li>' + s.title + ': ' + s.count + '</li>'; })
              .join('');
            out.innerHTML =
              '<div><strong>' + res.totalCount + ' titles</strong> · updated ' + res.generatedAt + '</div>' +
              '<div style="margin:0.5rem 0">' +
                '<a href="' + res.pdfUrl + '" target="_blank" rel="noopener">Open PDF (stable link)</a> · ' +
                '<a href="' + res.docUrl + '" target="_blank" rel="noopener">Open Doc</a>' +
              '</div>' +
              '<ul>' + lines + '</ul>';
          })
          .withFailureHandler(function (err) {
            btn.disabled = false;
            out.innerHTML = '<span class="error">Error: ' + err.message + '</span>';
          })
          .generateCatalogue();
      }
    </script>
  </body>
</html>
